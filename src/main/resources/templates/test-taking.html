<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${test['title']} + ' | Apna Academy'">Practice test</title><link rel="stylesheet" th:href="@{/css/site.css}"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main class="page-wrap narrow"><span class="eyebrow">PRACTICE TEST</span><h1 th:text="${test['title']}">Test</h1><p class="lead" th:text="${test['description']}"></p><form class="form-card" method="post" th:action="@{/tests/{id}/submit(id=${test['id']})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><fieldset class="question" th:each="question,iter : ${questions}"><legend><span th:text="${iter.index + 1 + '. ' + question['question']}">Question</span></legend><label th:each="option : ${ {'A':question['option_a'],'B':question['option_b'],'C':question['option_c'],'D':question['option_d']} }" th:if="${option.value != null}"><input type="radio" th:name="${'q_' + question['id']}" th:value="${option.key}"><span th:text="${option.value}"></span></label></fieldset><div class="empty-state" th:if="${#lists.isEmpty(questions)}">This test has no questions yet.</div><button class="button button-primary" type="submit" th:if="${!#lists.isEmpty(questions)}">Submit answers</button><p class="muted">Sign in as a student before submitting.</p></form></main><footer th:replace="~{fragments/footer :: footer}"></footer></body></html>
