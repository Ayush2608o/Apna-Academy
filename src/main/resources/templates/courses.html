<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Courses | Apna Academy</title><link rel="stylesheet" th:href="@{/css/site.css}"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main class="page-wrap"><span class="eyebrow">FIND YOUR PATH</span><h1>Courses</h1><p class="lead">Explore the courses currently offered by Apna Academy.</p><div class="card-grid" th:if="${!#lists.isEmpty(courses)}"><article class="course-card" th:each="course : ${courses}"><div class="card-accent"><span>✦</span></div><div class="course-body"><span class="tag" th:text="${course['duration'] ?: 'Flexible learning'}">Duration</span><h3 th:text="${course['course_name']}">Course</h3><p th:text="${course['description'] ?: ''}"></p><div class="course-meta"><span th:text="${course['fees']}"></span><a th:href="@{/courses/{id}(id=${course['id']})}">Details →</a></div></div></article></div><div class="empty-state" th:if="${#lists.isEmpty(courses)}">No courses have been published yet.</div></main><footer th:replace="~{fragments/footer :: footer}"></footer></body></html>
