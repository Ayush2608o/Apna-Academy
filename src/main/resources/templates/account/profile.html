<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | Apna Academy</title><link rel="stylesheet" th:href="@{/css/site.css}"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main class="page-wrap narrow"><span class="eyebrow" th:text="${area == 'admin' ? 'ADMIN PROFILE' : 'STUDENT PROFILE'}">PROFILE</span><h1>Profile</h1><div class="alert success" th:if="${success}" th:text="${success}"></div><div class="alert error" th:if="${error}" th:text="${error}"></div><section class="content-panel"><dl class="detail-list"><dt>Name</dt><dd th:text="${profile['name']}"></dd><dt>Email</dt><dd th:text="${profile['email']}"></dd><dt th:if="${profile['course_name'] != null}">Course</dt><dd th:if="${profile['course_name'] != null}" th:text="${profile['course_name']}"></dd><dt th:if="${profile['status'] != null}">Status</dt><dd th:if="${profile['status'] != null}" th:text="${profile['status']}"></dd><dt th:if="${profile['role'] != null}">Role</dt><dd th:if="${profile['role'] != null}" th:text="${profile['role']}"></dd></dl></section><form class="form-card" method="post" th:action="@{/{area}/change-password(area=${area})}"><h2>Change password</h2><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Current password<input name="currentPassword" type="password" required autocomplete="current-password"></label><label>New password<input name="newPassword" type="password" required minlength="8" maxlength="72" autocomplete="new-password"></label><label>Confirm new password<input name="confirmPassword" type="password" required minlength="8" maxlength="72" autocomplete="new-password"></label><button class="button button-primary" type="submit">Update password</button></form></main><footer th:replace="~{fragments/footer :: footer}"></footer></body></html>
