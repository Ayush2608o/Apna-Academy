<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course enquiry | Apna Academy</title><link rel="stylesheet" th:href="@{/css/site.css}"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main class="page-wrap narrow"><span class="eyebrow">START A CONVERSATION</span><h1>Course enquiry</h1><form class="form-card" method="post" th:action="@{/enquiry}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Name<input name="name" required maxlength="150"></label><label>Email<input name="email" type="email" maxlength="150"></label><label>Phone<input name="phone" maxlength="20"></label><label>Course<select name="course"><option value="">Choose a course</option><option th:each="course : ${courses}" th:value="${course['course_name']}" th:text="${course['course_name']}"></option></select></label><label>Message<textarea name="message" rows="4" maxlength="5000"></textarea></label><button class="button button-primary" type="submit">Submit enquiry →</button></form></main><footer th:replace="~{fragments/footer :: footer}"></footer></body></html>
