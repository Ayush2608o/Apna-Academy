<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Practice tests | Apna Academy</title><link rel="stylesheet" th:href="@{/css/site.css}"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main class="page-wrap"><span class="eyebrow">PRACTICE AND PROGRESS</span><h1>Online practice tests</h1><div class="card-grid" th:if="${!#lists.isEmpty(tests)}"><article class="info-card" th:each="test : ${tests}"><span class="tag" th:text="${test['duration_minutes']} + ' minutes'"></span><h3 th:text="${test['title']}">Test</h3><p th:text="${test['description']}"></p><p>Total marks: <strong th:text="${test['total_marks']}"></strong></p><a class="button button-primary" th:href="@{/tests/{id}(id=${test['id']})}">Open test</a></article></div><div class="empty-state" th:if="${#lists.isEmpty(tests)}">There are no active practice tests yet.</div><p><a th:href="@{/login}">Sign in as a student</a> to submit a test and save a result.</p></main><footer th:replace="~{fragments/footer :: footer}"></footer></body></html>
