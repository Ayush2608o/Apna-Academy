<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student registration | Apna Academy</title><link rel="stylesheet" th:href="@{/css/site.css}"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main class="page-wrap narrow"><span class="eyebrow">YOUR LEARNING JOURNEY</span><h1>Create a student account</h1><div class="alert error" th:if="${formError}" th:text="${formError}"></div><form class="form-card" method="post" th:action="@{/register}" th:object="${form}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Full name<input th:field="*{name}" required maxlength="150"><small class="field-error" th:errors="*{name}"></small></label><label>Email<input th:field="*{email}" type="email" required maxlength="150"><small class="field-error" th:errors="*{email}"></small></label><label>Phone<input th:field="*{phone}" maxlength="20"></label><label>Course<select th:field="*{courseId}"><option value="">Choose later</option><option th:each="course : ${courses}" th:value="${course['id']}" th:text="${course['course_name']}"></option></select></label><label>Password<input th:field="*{password}" type="password" required minlength="8" maxlength="72" autocomplete="new-password"><small class="field-error" th:errors="*{password}"></small></label><button class="button button-primary" type="submit">Create account →</button></form></main><footer th:replace="~{fragments/footer :: footer}"></footer></body></html>
