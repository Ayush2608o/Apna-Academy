<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test results | Apna Academy</title><link rel="stylesheet" th:href="@{/css/site.css}"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main class="page-wrap"><div class="section-heading"><div><span class="eyebrow">YOUR PROGRESS</span><h1>Test results</h1></div><a class="button button-quiet" th:href="@{/student}">Student dashboard</a></div><div class="alert success" th:if="${score != null}">Test submitted. Score: <strong th:text="${score}"></strong></div><div class="empty-state" th:if="${#lists.isEmpty(results)}">No test results yet.</div><div class="table-wrap" th:if="${!#lists.isEmpty(results)}"><table><thead><tr><th>Test</th><th>Score</th><th>Total</th><th>Submitted</th></tr></thead><tbody><tr th:each="result : ${results}"><td th:text="${result['test_title']}"></td><td th:text="${result['obtained_marks']}"></td><td th:text="${result['total_marks']}"></td><td th:text="${result['submitted_at']}"></td></tr></tbody></table></div></main><footer th:replace="~{fragments/footer :: footer}"></footer></body></html>
