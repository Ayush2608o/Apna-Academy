<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Certificate verification | Apna Academy</title>
  <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
<header th:replace="~{fragments/nav :: nav}"></header>
<main class="page-wrap narrow">
  <span class="eyebrow">CREDENTIAL CHECK</span>
  <h1>Verify a certificate</h1>
  <p class="lead">Enter the exact certificate number from the academy database.</p>
  <form class="form-card form-inline" method="post" th:action="@{/certificate/verify}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <label>Certificate number<input name="certificateNumber" th:value="${certificateNumber}" required maxlength="100"></label>
    <button class="button button-primary" type="submit">Verify</button>
  </form>
  <div th:if="${matches != null}" class="content-panel">
    <div th:if="${unavailable}" class="alert error">No certificate records are registered yet.</div>
    <div th:if="${!unavailable and #lists.isEmpty(matches)}" class="alert error">No certificate matched that number.</div>
    <div th:each="item : ${matches}">
      <span class="eyebrow">CERTIFICATE RECORD</span>
      <h2 th:text="${item['student_name']}">Student</h2>
      <p>Course: <strong th:text="${item['course_name']}"></strong></p>
      <p>Certificate number: <strong th:text="${item['certificate_number']}"></strong></p>
      <p>Status: <strong th:text="${item['status']}"></strong></p>
      <p>Issue date: <span th:text="${item['issue_date']}"></span></p>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
