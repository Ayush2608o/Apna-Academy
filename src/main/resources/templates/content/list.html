<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${title} + ' | Apna Academy'">Apna Academy</title><link rel="stylesheet" th:href="@{/css/site.css}"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main class="page-wrap"><span class="eyebrow">APNA ACADEMY</span><h1 th:text="${title}">Information</h1><div class="card-grid" th:if="${!#lists.isEmpty(items)}"><article class="info-card" th:each="item : ${items}"><h3 th:text="${item['name'] ?: item['title'] ?: item['job_title'] ?: item['company_name'] ?: item['role'] ?: item['id']}">Item</h3><p th:each="entry : ${item}" th:if="${entry.key != 'id' and entry.value != null and entry.key != 'created_at'}"><strong th:text="${#strings.replace(entry.key, '_', ' ')}">field</strong><span th:text="${entry.value}">value</span></p><a th:if="${item['file_path'] != null}" class="text-link" th:href="${item['file_path']}" target="_blank" rel="noopener">Open resource →</a><a th:if="${item['application_link'] != null}" class="text-link" th:href="${item['application_link']}" target="_blank" rel="noopener">Apply →</a></article></div><div class="empty-state" th:if="${#lists.isEmpty(items)}">There are no published records yet.</div></main><footer th:replace="~{fragments/footer :: footer}"></footer></body></html>
