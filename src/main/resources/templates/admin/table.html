<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${title} + ' | Admin'">Admin records</title><link rel="stylesheet" th:href="@{/css/site.css}"></head><body class="dashboard-body"><header th:replace="~{fragments/nav :: nav}"></header><main class="page-wrap"><div class="section-heading"><div><a class="text-link" th:href="@{/admin}">← Dashboard</a><span class="eyebrow">RECORD MANAGEMENT</span><h1 th:text="${title}">Records</h1></div></div><div class="alert success" th:if="${success}" th:text="${success}"></div><div class="alert error" th:if="${error}" th:text="${error}"></div><section class="content-panel"><h2>Add record</h2><p class="muted">Required fields are shown in the database schema. Related IDs must refer to existing records.</p><form class="admin-create-form" method="post" th:action="@{/admin/manage/{module}/create(module=${module})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label th:each="column : ${columns}" th:if="${column['name'] != 'id' and !#strings.contains(column['extra'], 'auto_increment') and column['name'] != 'created_at' and column['name'] != 'uploaded_at'}"><span th:text="${#strings.replace(column['name'], '_', ' ')}">Field</span><textarea th:if="${column['dataType'] == 'text' or column['dataType'] == 'mediumtext' or column['dataType'] == 'longtext'}" th:name="${column['name']}" rows="2"></textarea><input th:unless="${column['dataType'] == 'text' or column['dataType'] == 'mediumtext' or column['dataType'] == 'longtext'}" th:type="${column['dataType'] == 'date' ? 'date' : (column['dataType'] == 'time' ? 'time' : (column['dataType'] == 'datetime' or column['dataType'] == 'timestamp' ? 'datetime-local' : (column['dataType'] == 'int' or column['dataType'] == 'bigint' or column['dataType'] == 'decimal' ? 'number' : 'text')))}" th:step="${column['dataType'] == 'decimal' ? '0.01' : null}" th:name="${column['name']}" th:required="${column['nullable'] == 'NO' and column['defaultValue'] == null}" th:maxlength="${column['dataType'].startsWith('varchar') ? 500 : null}"></label><button class="button button-primary" type="submit">Add record</button></form></section><section class="section"><div class="section-heading"><div><h2>Existing records</h2><p class="muted">Showing up to 250 recent records. Password accounts are managed separately.</p></div></div><div class="empty-state" th:if="${#lists.isEmpty(rows)}">No records in this module yet.</div><div class="table-wrap" th:if="${!#lists.isEmpty(rows)}"><table><thead><tr><th th:each="column : ${columns}" th:text="${#strings.replace(column['name'], '_', ' ')}">Field</th><th>Actions</th></tr></thead><tbody><tr th:each="row : ${rows}"><td th:each="column : ${columns}" th:text="${row[column['name']]}"></td><td class="row-actions"><details><summary>Edit</summary><form class="edit-form" method="post" th:action="@{/admin/manage/{module}/{id}/update(module=${module},id=${row['id']})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label th:each="column : ${columns}" th:if="${column['name'] != 'id' and !#strings.contains(column['extra'], 'auto_increment') and column['name'] != 'created_at' and column['name'] != 'uploaded_at'}"><span th:text="${#strings.replace(column['name'], '_', ' ')}">Field</span><textarea th:if="${column['dataType'] == 'text' or column['dataType'] == 'mediumtext' or column['dataType'] == 'longtext'}" th:name="${column['name']}" th:text="${row[column['name']]}" rows="2"></textarea><input th:unless="${column['dataType'] == 'text' or column['dataType'] == 'mediumtext' or column['dataType'] == 'longtext'}" th:type="${column['dataType'] == 'date' ? 'date' : (column['dataType'] == 'time' ? 'time' : (column['dataType'] == 'datetime' or column['dataType'] == 'timestamp' ? 'datetime-local' : (column['dataType'] == 'int' or column['dataType'] == 'bigint' or column['dataType'] == 'decimal' ? 'number' : 'text')))}" th:name="${column['name']}" th:value="${row[column['name']]}" th:step="${column['dataType'] == 'decimal' ? '0.01' : null}"></label><button class="button button-small button-primary" type="submit">Save</button></form></details><form method="post" th:action="@{/admin/manage/{module}/{id}/delete(module=${module},id=${row['id']})}" onsubmit="return confirm('Delete this record?')"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button button-small button-danger" type="submit">Delete</button></form></td></tr></tbody></table></div></section></main><footer th:replace="~{fragments/footer :: footer}"></footer></body></html>
