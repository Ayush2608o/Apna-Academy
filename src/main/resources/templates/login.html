<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Apna Academy</title><link rel="stylesheet" th:href="@{/css/site.css}"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main class="page-wrap narrow"><span class="eyebrow">WELCOME BACK</span><h1>Sign in</h1><div class="alert error" th:if="${param.error}">Email or password was incorrect.</div><div class="alert success" th:if="${param.loggedout}">You have signed out.</div><div class="alert success" th:if="${success}" th:text="${success}"></div><form class="form-card" method="post" th:action="@{/login}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Email<input name="username" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button button-primary" type="submit">Sign in →</button><p class="form-foot">New to Apna Academy? <a th:href="@{/register}">Create a student account</a></p></form></main><footer th:replace="~{fragments/footer :: footer}"></footer></body></html>
