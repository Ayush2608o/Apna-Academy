<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${course['course_name']} + ' | Apna Academy'">Course | Apna Academy</title><link rel="stylesheet" th:href="@{/css/site.css}"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main class="page-wrap"><a class="text-link" th:href="@{/courses}">← All courses</a><div class="content-panel course-detail"><span class="eyebrow">COURSE DETAILS</span><h1 th:text="${course['course_name']}">Course</h1><p class="lead" th:text="${course['description']}"></p><dl class="detail-list"><dt>Duration</dt><dd th:text="${course['duration'] ?: 'Contact us'}"></dd><dt>Fees</dt><dd th:text="${course['fees'] != null ? '₹ ' + course['fees'] : 'Contact us'}"></dd></dl><a class="button button-primary" th:href="@{/enquiry}">Enquire about this course</a></div></main><footer th:replace="~{fragments/footer :: footer}"></footer></body></html>
