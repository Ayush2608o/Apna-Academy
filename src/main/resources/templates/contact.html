<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | Apna Academy</title><link rel="stylesheet" th:href="@{/css/site.css}"></head><body><header th:replace="~{fragments/nav :: nav}"></header><main class="page-wrap narrow"><span class="eyebrow">WE'RE HERE TO HELP</span><h1>Contact us</h1><p class="lead">Share your question and the academy team will follow up.</p><p class="alert success" th:if="${success}" th:text="${success}"></p><form class="form-card" method="post" th:action="@{/contact}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Name<input name="name" required maxlength="150"></label><label>Email<input name="email" type="email" maxlength="150"></label><label>Phone<input name="phone" maxlength="20"></label><label>Course interest<input name="course" maxlength="150"></label><label>Message<textarea name="message" rows="5" maxlength="5000"></textarea></label><button class="button button-primary" type="submit">Send enquiry →</button></form></main><footer th:replace="~{fragments/footer :: footer}"></footer></body></html>
